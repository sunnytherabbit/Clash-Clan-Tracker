services:
  - type: web
    name: clash-clan-tracker-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd flask-server && gunicorn --bind 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: CLASH_ROYALE_TOKEN
        sync: false
      - key: CLASH_ROYALE_BASE_URL
        value: https://proxy.royaleapi.dev/v1
      - key: CLAN_TAG
        value: "%23RY8LY"
      - key: SETTINGS_PASSWORD
        sync: false
